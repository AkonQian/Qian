name: Phone UI gallery
on:
  push:
    branches: ['phone-ui-gallery-0310']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gallery:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: MOTO-GPS-unsigned-IPA
          path: build/gallery-input
          github-token: ${{ github.token }}
          run-id: 42149121455
      - name: Restore identical bundled Shenzhen data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          ipa=next(Path('build/gallery-input').glob('*.ipa'))
          assert hashlib.sha256(ipa.read_bytes()).hexdigest()=='00f156a96b8b68f983107f9b40ec0e7b49cba0a2045353d61164fa8e1c69f5a8'
          with zipfile.ZipFile(ipa) as z:
              name=next(n for n in z.namelist() if n.endswith('/shenzhen-v1.sqlite'))
              data=z.read(name)
          assert hashlib.sha256(data).hexdigest()=='665b8bc749b6dab1f3a3ee48f3b26b1e901d1850ad754edbe66c9258c46a2885'
          target=Path('shared/offline_map/shenzhen-v1.sqlite')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          PY
      - name: Prepare gallery build
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate --spec platforms/ios/project.yml
      - name: Select simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          phones=[d for runtime,items in devices.items() if 'iOS' in runtime for d in items if 'iPhone' in d['name']]
          assert phones
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('id='+phones[0]['udid']+'\n')
          PY
      - name: Capture current app views
        run: |
          xcodebuild test -project platforms/ios/MotoGPS.xcodeproj -scheme MotoGPS \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build/gallery-tests -resultBundlePath build/PhoneGallery.xcresult \
            -only-testing:MotoGPSUITests/PhoneGalleryUITests CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          if [ -d build/PhoneGallery.xcresult ]; then
            xcrun xcresulttool export attachments --path build/PhoneGallery.xcresult --output-path build/phone-gallery-screenshots
          fi
      - name: Upload gallery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Qian-GPS-phone-UI-gallery
          path: build/phone-gallery-screenshots
          if-no-files-found: warn
          retention-days: 14
