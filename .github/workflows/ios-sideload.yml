name: iOS sideload build

on:
  push:
    paths: ['platforms/ios/**', 'shared/**', 'scripts/ios/**', '.github/workflows/ios-sideload.yml']
  pull_request:
    paths: ['platforms/ios/**', 'shared/**', 'scripts/ios/**', '.github/workflows/ios-sideload.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified released Shenzhen map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/13725599936/zip > build/verified-map-ipa.zip
          python3 scripts/ios/restore_verified_shenzhen.py build/verified-map-ipa.zip
      - name: Prepare Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodebuild -version
          xcodegen generate --spec platforms/ios/project.yml
      - name: Select available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          iphones = [d for runtime, values in devices.items() if 'iOS' in runtime for d in values if 'iPhone' in d['name']]
          if not iphones:
              raise SystemExit('No iPhone simulator is installed')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('id=' + iphones[0]['udid'] + '\n')
          PY
      - name: App unit tests and offline gateway UI tests
        run: |
          xcodebuild test -project platforms/ios/MotoGPS.xcodeproj -scheme MotoGPS \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build/ios-tests -resultBundlePath build/GatewayTests.xcresult \
            -only-testing:MotoGPSUnitTests -only-testing:MotoGPSUITests/GatewaySettingsUITests \
            CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned IPA for re-signing
        run: bash scripts/ios/build_sideload_ipa.sh
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d build/GatewayTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/GatewayTests.xcresult --output-path build/ui-screenshots
          fi
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MOTO-GPS-unsigned-IPA
          path: |
            build/sideload/*.ipa
            build/sideload/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iOS-test-results
          path: |
            build/GatewayTests.xcresult
            build/ui-screenshots
          retention-days: 14
